<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeQuest — Find a home that fits your life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   1. TOKENS & RESET
   ============================================================ */
:root{
  --brand:#0f766e;
  --brand-600:#0d655e;
  --brand-50:#ecfdf5;
  --accent:#f59e0b;
  --ink:#0f172a;
  --ink-2:#334155;
  --muted:#64748b;
  --line:#e2e8f0;
  --bg:#f6f8fb;
  --card:#ffffff;
  --danger:#e11d48;
  --radius:16px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.08);
  --shadow-md:0 12px 28px -8px rgba(15,23,42,.16);
  --shadow-lg:0 30px 60px -16px rgba(15,23,42,.34);
  --maxw:1200px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
img,svg{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{text-decoration:none;color:inherit}
ul{list-style:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

.wrap{width:min(100% - 2rem, var(--maxw));margin-inline:auto}

/* ============================================================
   2. BUTTONS & SHARED
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  border:1px solid transparent;border-radius:12px;
  padding:.65rem 1.1rem;font-weight:700;font-size:.88rem;
  cursor:pointer;transition:transform .18s, background .18s, box-shadow .18s, border-color .18s, color .18s;
  white-space:nowrap;
}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 10px 20px -10px rgba(15,118,110,.95)}
.btn-primary:hover{background:var(--brand-600);transform:translateY(-1px)}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn-block{width:100%}
.btn[disabled]{opacity:.65;cursor:not-allowed;transform:none!important;box-shadow:none}
.btn .spinner{
  width:16px;height:16px;border-radius:50%;
  border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============================================================
   3. HEADER
   ============================================================ */
.site-header{
  position:sticky;top:0;z-index:60;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.header-inner{display:flex;align-items:center;gap:1rem;height:72px}
.logo{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.12rem;letter-spacing:-.02em}
.logo-mark{
  width:38px;height:38px;border-radius:12px;flex:none;
  background:linear-gradient(135deg,var(--brand),#14b8a6);
  display:grid;place-items:center;color:#fff;
  box-shadow:0 8px 16px -6px rgba(15,118,110,.8);
}
.nav{display:flex;gap:1.6rem;margin-inline:auto;font-weight:600;font-size:.92rem;color:var(--ink-2)}
.nav a{transition:color .18s}
.nav a:hover{color:var(--brand)}
.header-actions{display:flex;align-items:center;gap:.55rem;margin-left:auto}
.hamburger{
  display:none;width:42px;height:42px;border-radius:12px;
  border:1px solid var(--line);background:#fff;cursor:pointer;
  place-items:center;color:var(--ink-2);
}

/* ============================================================
   4. HERO
   ============================================================ */
.hero{
  position:relative;overflow:hidden;
  padding:3.6rem 0 4.4rem;
  background:
    radial-gradient(900px 420px at 82% -12%, #ccfbf1 0%, transparent 62%),
    radial-gradient(760px 420px at 2% 6%, #dbeafe 0%, transparent 58%),
    #f8fafc;
}
.hero::after{
  content:"";position:absolute;inset:auto -10% -60% -10%;height:340px;
  background:radial-gradient(closest-side, rgba(15,118,110,.10), transparent);
  pointer-events:none;
}
.hero-inner{position:relative;z-index:1;max-width:820px}
.pill{
  display:inline-flex;align-items:center;gap:.45rem;
  background:#fff;border:1px solid var(--line);
  padding:.4rem .85rem;border-radius:999px;
  font-size:.78rem;font-weight:700;color:var(--ink-2);
  box-shadow:var(--shadow-sm);
}
.pill .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.18)}
.hero h1{
  font-size:clamp(2rem,4.6vw,3.2rem);
  line-height:1.1;letter-spacing:-.03em;font-weight:800;
  margin:1.1rem 0 .85rem;
}
.hero h1 em{font-style:normal;color:var(--brand);position:relative;white-space:nowrap}
.hero h1 em::after{
  content:"";position:absolute;left:0;right:0;bottom:.08em;height:.28em;
  background:rgba(245,158,11,.28);border-radius:4px;z-index:-1;
}
.lead{color:var(--muted);font-size:1.02rem;max-width:620px}

/* Search bar */
.searchbar{
  display:grid;grid-template-columns:1.5fr 1fr 1fr auto;
  gap:.75rem;align-items:end;
  background:#fff;border:1px solid var(--line);
  border-radius:20px;padding:1rem;margin-top:2rem;
  box-shadow:var(--shadow-md);
}
.field label{
  display:block;font-size:.7rem;font-weight:800;
  text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  margin-bottom:.35rem;
}
.field input,.field select{
  width:100%;border:1px solid var(--line);background:#f8fafc;
  border-radius:12px;padding:.72rem .85rem;outline:none;
  transition:border-color .18s, box-shadow .18s, background .18s;
  font-size:.9rem;
}
.field input:focus,.field select:focus{
  border-color:var(--brand);background:#fff;
  box-shadow:0 0 0 3px rgba(15,118,110,.13);
}
.search-btn{padding:.78rem 1.5rem;border-radius:12px}

/* Stats */
.stats{display:flex;gap:2.2rem;flex-wrap:wrap;margin-top:2rem}
.stats li strong{display:block;font-size:1.35rem;font-weight:800;letter-spacing:-.02em}
.stats li span{font-size:.8rem;color:var(--muted);font-weight:600}

/* ============================================================
   5. LISTINGS
   ============================================================ */
main{padding:2.6rem 0 4rem}
.section-head{
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:1rem;flex-wrap:wrap;margin-bottom:1.2rem;
}
.section-head h2{font-size:1.5rem;letter-spacing:-.02em}
.section-head p{color:var(--muted);font-size:.88rem;margin-top:.15rem}
.sort{display:flex;align-items:center;gap:.55rem;font-size:.85rem;color:var(--muted);font-weight:600}
.sort select{
  border:1px solid var(--line);background:#fff;border-radius:11px;
  padding:.55rem .8rem;font-size:.85rem;font-weight:600;color:var(--ink);
  cursor:pointer;outline:none;
}
.sort select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.13)}

/* Filter chips */
.filters{
  display:flex;align-items:center;gap:1rem;
  flex-wrap:wrap;padding-bottom:1.4rem;
  border-bottom:1px solid var(--line);margin-bottom:1.6rem;
}
.chips{
  display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.3rem;
  scrollbar-width:none;flex:1;min-width:240px;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  white-space:nowrap;border:1px solid var(--line);background:#fff;
  border-radius:999px;padding:.5rem 1rem;
  font-size:.83rem;font-weight:700;color:var(--ink-2);
  cursor:pointer;transition:all .18s;
}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.active{
  background:var(--brand);border-color:var(--brand);color:#fff;
  box-shadow:0 8px 16px -8px rgba(15,118,110,.95);
}
.filters select{
  border:1px solid var(--line);background:#fff;border-radius:11px;
  padding:.55rem .8rem;font-size:.83rem;font-weight:600;
  cursor:pointer;outline:none;
}
.filters select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.13)}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1.4rem}

/* Card */
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:var(--shadow-sm);
  transition:transform .25s cubic-bezier(.2,.7,.3,1), box-shadow .25s, border-color .25s;
  animation:rise .45s both;
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-5px);box-shadow:var(--shadow-md);border-color:#cbd5e1}

.thumb{
  position:relative;aspect-ratio:16/10;
  background-size:cover;background-position:center;
  background-color:#e2e8f0;
}
.badge{
  position:absolute;top:.7rem;left:.7rem;
  background:rgba(255,255,255,.95);color:var(--ink);
  font-size:.72rem;font-weight:800;letter-spacing:.01em;
  padding:.32rem .68rem;border-radius:999px;
  backdrop-filter:blur(6px);
}
.ribbon{
  position:absolute;bottom:.7rem;left:.7rem;
  background:linear-gradient(135deg,var(--accent),#fb923c);color:#fff;
  font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;
  padding:.3rem .6rem;border-radius:8px;
  box-shadow:0 6px 14px -6px rgba(245,158,11,.95);
}
.fav{
  position:absolute;top:.6rem;right:.6rem;
  width:38px;height:38px;border-radius:50%;border:none;
  background:rgba(255,255,255,.95);color:#94a3b8;
  display:grid;place-items:center;cursor:pointer;
  transition:transform .18s, color .18s;
  backdrop-filter:blur(6px);
}
.fav:hover{transform:scale(1.1)}
.fav.on{color:#ef4444}

.body{padding:1rem 1rem 1.05rem;display:flex;flex-direction:column;gap:.6rem;flex:1}
.card-title{font-size:1.02rem;font-weight:800;letter-spacing:-.015em;line-height:1.3}
.loc{display:flex;align-items:center;gap:.35rem;color:var(--muted);font-size:.82rem;font-weight:600}
.loc svg{flex:none;color:var(--brand)}
.meta{display:flex;flex-wrap:wrap;gap:.85rem;color:var(--muted);font-size:.79rem;font-weight:600}
.meta li{display:flex;align-items:center;gap:.32rem}
.meta svg{flex:none;opacity:.75}

.card-foot{
  display:flex;align-items:center;justify-content:space-between;
  gap:.75rem;margin-top:auto;padding-top:.85rem;
  border-top:1px dashed var(--line);
}
.price strong{font-size:1.12rem;font-weight:800;letter-spacing:-.02em}
.price span{color:var(--muted);font-size:.78rem;font-weight:700}

/* Empty + load more */
.empty{
  text-align:center;padding:3.5rem 1rem;color:var(--muted);
  border:1px dashed var(--line);border-radius:var(--radius);background:#fff;
}
.empty strong{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:.35rem}
.load-wrap{display:flex;justify-content:center;margin-top:2.2rem}

/* ============================================================
   6. HOW IT WORKS
   ============================================================ */
.how{
  background:#fff;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);padding:3.2rem 0;
}
.how h2{text-align:center;font-size:1.5rem;letter-spacing:-.02em;margin-bottom:.4rem}
.how .sub{text-align:center;color:var(--muted);font-size:.92rem;margin-bottom:2.2rem}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1.2rem}
.step-card{
  background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);
  padding:1.4rem;position:relative;
}
.step-num{
  width:36px;height:36px;border-radius:11px;
  background:var(--brand-50);color:var(--brand);
  display:grid;place-items:center;font-weight:800;font-size:.9rem;
  margin-bottom:.85rem;border:1px solid rgba(15,118,110,.18);
}
.step-card h3{font-size:1rem;margin-bottom:.3rem;letter-spacing:-.01em}
.step-card p{color:var(--muted);font-size:.85rem}

/* ============================================================
   7. FOOTER
   ============================================================ */
.site-footer{background:#0f172a;color:#cbd5e1;padding:2.6rem 0;margin-top:0}
.footer-inner{display:flex;justify-content:space-between;gap:1.5rem;flex-wrap:wrap;align-items:center}
.site-footer .logo{color:#fff}
.footer-links{display:flex;gap:1.4rem;font-size:.85rem;font-weight:600;flex-wrap:wrap}
.footer-links a:hover{color:#fff}
.footer-note{font-size:.78rem;color:#7c8aa0;width:100%;padding-top:1.4rem;border-top:1px solid #1e293b;margin-top:.6rem}

/* ============================================================
   8. MODAL
   ============================================================ */
.overlay{
  position:fixed;inset:0;z-index:120;
  background:rgba(15,23,42,.58);
  backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  display:grid;place-items:center;padding:1rem;
  opacity:0;visibility:hidden;transition:opacity .25s, visibility .25s;
}
.overlay.open{opacity:1;visibility:visible}
.modal{
  width:min(580px,100%);max-height:92vh;overflow-y:auto;
  background:#fff;border-radius:22px;
  box-shadow:var(--shadow-lg);
  transform:translateY(16px) scale(.975);
  transition:transform .3s cubic-bezier(.2,.8,.3,1);
  position:relative;
}
.overlay.open .modal{transform:none}
.modal::-webkit-scrollbar{width:8px}
.modal::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px}

.modal-close{
  position:absolute;top:.85rem;right:.85rem;z-index:5;
  width:36px;height:36px;border-radius:50%;border:none;
  background:#f1f5f9;color:var(--ink-2);cursor:pointer;
  display:grid;place-items:center;font-size:1.15rem;line-height:1;
  transition:background .18s;
}
.modal-close:hover{background:#e2e8f0}

/* Stepper */
.stepper{
  display:flex;gap:.4rem;padding:1.15rem 1.25rem .95rem;
  border-bottom:1px solid var(--line);
  position:sticky;top:0;background:#fff;z-index:4;
}
.step{
  flex:1;display:flex;align-items:center;gap:.45rem;
  font-size:.76rem;font-weight:800;color:var(--muted);
}
.step span{
  width:24px;height:24px;border-radius:50%;flex:none;
  display:grid;place-items:center;
  background:#f1f5f9;color:var(--muted);font-size:.72rem;
  transition:background .2s, color .2s;
}
.step.active{color:var(--brand)}
.step.active span{background:var(--brand);color:#fff;box-shadow:0 0 0 4px rgba(15,118,110,.13)}
.step.done span{background:#d1fae5;color:var(--brand)}

.modal-body{padding:1.25rem}
.panel[hidden]{display:none}

/* Property summary */
.summary{
  display:flex;gap:.85rem;align-items:center;
  background:var(--bg);border:1px solid var(--line);
  border-radius:14px;padding:.7rem;margin-bottom:1.1rem;
}
.summary .thumb-sm{
  width:74px;height:60px;border-radius:11px;flex:none;
  background-size:cover;background-position:center;background-color:#e2e8f0;
}
.summary h4{font-size:.92rem;letter-spacing:-.01em;line-height:1.25}
.summary p{font-size:.77rem;color:var(--muted);font-weight:600;margin-top:.15rem}
.summary .amt{margin-left:auto;text-align:right;font-weight:800;font-size:.92rem;white-space:nowrap}
.summary .amt small{display:block;font-size:.7rem;color:var(--muted);font-weight:700}

/* Info box */
.note{
  display:flex;gap:.6rem;align-items:flex-start;
  background:var(--brand-50);border:1px solid rgba(15,118,110,.2);
  color:#0b4f49;border-radius:13px;padding:.8rem .9rem;
  font-size:.81rem;font-weight:600;line-height:1.45;margin-bottom:1.15rem;
}
.note svg{flex:none;margin-top:.1rem}
.note.warn{background:#fffbeb;border-color:rgba(245,158,11,.3);color:#92400e}

/* Payment methods */
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:1.15rem}
.method{
  position:relative;border:1.5px solid var(--line);border-radius:13px;
  padding:.75rem .5rem;text-align:center;cursor:pointer;
  font-size:.78rem;font-weight:700;color:var(--ink-2);
  background:#fff;transition:all .18s;
}
.method input{position:absolute;opacity:0;pointer-events:none}
.method:hover{border-color:#94a3b8}
.method.on{border-color:var(--brand);background:var(--brand-50);color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.1)}
.method svg{margin:0 auto .3rem;opacity:.9}

/* Form */
.form-grid{display:grid;gap:.8rem}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.lbl{display:block;font-size:.76rem;font-weight:800;color:var(--ink-2);margin-bottom:.32rem}
.input,.select,.textarea{
  width:100%;border:1px solid var(--line);background:#fff;
  border-radius:12px;padding:.7rem .85rem;font-size:.88rem;
  outline:none;transition:border-color .18s, box-shadow .18s;
}
.textarea{resize:vertical;min-height:84px;font-family:inherit}
.input:focus,.select:focus,.textarea:focus{
  border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.13);
}
.input.invalid,.select.invalid{border-color:var(--danger);box-shadow:0 0 0 3px rgba(225,29,72,.12)}
.err{color:var(--danger);font-size:.72rem;font-weight:700;margin-top:.25rem;display:none}
.err.show{display:block}

/* Totals */
.totals{
  border-top:1px dashed var(--line);margin-top:1.15rem;padding-top:.9rem;
  display:grid;gap:.45rem;font-size:.85rem;
}
.totals div{display:flex;justify-content:space-between;color:var(--muted);font-weight:600}
.totals div.grand{color:var(--ink);font-weight:800;font-size:1rem;padding-top:.45rem;border-top:1px solid var(--line)}

.secure{
  display:flex;align-items:center;justify-content:center;gap:.4rem;
  color:var(--muted);font-size:.75rem;font-weight:700;margin-top:.7rem;
}

/* Success */
.success{text-align:center;padding:.6rem 0 .3rem}
.check{
  width:78px;height:78px;border-radius:50%;margin:0 auto 1.1rem;
  background:linear-gradient(135deg,#d1fae5,#a7f3d0);
  display:grid;place-items:center;color:var(--brand);
  animation:pop .45s cubic-bezier(.2,1.4,.5,1) both;
}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.success h3{font-size:1.25rem;letter-spacing:-.02em;margin-bottom:.4rem}
.success p{color:var(--muted);font-size:.88rem;max-width:380px;margin:0 auto 1.2rem}
.ref-box{
  display:inline-flex;flex-direction:column;gap:.15rem;
  background:var(--bg);border:1px dashed var(--line);border-radius:13px;
  padding:.75rem 1.4rem;margin-bottom:1.3rem;
}
.ref-box small{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.ref-box strong{font-size:1.05rem;letter-spacing:.03em;color:var(--brand)}

/* ============================================================
   9. TOAST
   ============================================================ */
.toast{
  position:fixed;left:50%;bottom:1.6rem;transform:translate(-50%,140%);
  background:#0f172a;color:#fff;font-size:.85rem;font-weight:700;
  padding:.75rem 1.2rem;border-radius:13px;z-index:200;
  box-shadow:var(--shadow-lg);transition:transform .35s cubic-bezier(.2,.9,.3,1);
  max-width:90vw;text-align:center;
}
.toast.show{transform:translate(-50%,0)}

/* ============================================================
   10. RESPONSIVE
   ============================================================ */
@media (max-width:980px){
  .nav{
    position:absolute;top:72px;left:0;right:0;margin:0;
    flex-direction:column;gap:0;
    background:#fff;border-bottom:1px solid var(--line);
    padding:.4rem 1.25rem 1rem;display:none;
    box-shadow:var(--shadow-md);
  }
  .nav.open{display:flex}
  .nav a{padding:.8rem 0;border-bottom:1px solid #f1f5f9}
  .hamburger{display:grid}
  .hide-sm{display:none}
  .searchbar{grid-template-columns:1fr 1fr}
  .search-btn{grid-column:1/-1}
}
@media (max-width:640px){
  .hero{padding:2.6rem 0 3.2rem}
  .searchbar{grid-template-columns:1fr;padding:.85rem;border-radius:18px}
  .stats{gap:1.4rem}
  .stats li strong{font-size:1.15rem}
  .grid{grid-template-columns:1fr;gap:1.1rem}
  .step{font-size:0;gap:0;justify-content:center}
  .step span{font-size:.72rem}
  .field-row{grid-template-columns:1fr}
  .methods{grid-template-columns:1fr 1fr}
  .summary .amt{display:none}
  .section-head{align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){
  *{animation-dur
